name: Gradle

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check local Project Zomboid libraries
        id: pz_libs
        shell: bash
        run: |
          missing=0
          for file in lib/zombie.jar lib/Kahlua.jar lib/fmod.jar lib/org.jar; do
            if [ ! -f "$file" ]; then
              echo "Missing $file"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Project Zomboid compile-time jars are not committed. Skipping build."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.pz_libs.outputs.available == 'true'
        run: ./gradlew build

